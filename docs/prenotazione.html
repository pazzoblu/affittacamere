<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://*.supabase.co; font-src 'self'; connect-src 'self' https://*.supabase.co; object-src 'none'; base-uri 'self'; form-action 'self'">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="favicon.ico" sizes="32x32">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="robots" content="noindex">
  <title>La mia prenotazione</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <div class="wrap">
      <a class="brand" href="./" data-c="titolo">Casa vacanze</a>
      <button class="menu-toggle" type="button" aria-label="Apri il menu" aria-expanded="false" aria-controls="site-nav">
        <span></span><span></span><span></span>
      </button>
      <nav class="site-nav" id="site-nav">
        <a href="./#alloggio">L'alloggio</a>
        <a href="prenotazione.html">La mia prenotazione</a>
        <a href="./#contatti">Contatti</a>
      </nav>
    </div>
  </header>

  <main class="wrap my-booking">
    <div id="config-msg"></div>
    <h1>La mia prenotazione</h1>
    <p class="muted">Inserisci il codice che hai ricevuto e l'email usata per prenotare.</p>

    <form id="lookup-form" class="card-form">
      <div class="row">
        <label>Codice prenotazione<input name="code" required maxlength="12" autocomplete="off" class="code-input" placeholder="es. 7KQ4MZ2P"></label>
        <label>Email<input name="email" type="email" required maxlength="200" autocomplete="email"></label>
      </div>
      <button class="btn" type="submit">Cerca</button>
      <div id="lookup-msg"></div>
    </form>

    <section id="booking" class="card-form" hidden>
      <div class="status-head">
        <div>
          <div class="muted small">Prenotazione <strong class="code" id="b-code"></strong></div>
          <h2 id="b-room"></h2>
          <div id="b-dates"></div>
        </div>
        <span class="status-pill" id="b-status"></span>
      </div>
      <dl class="facts" id="b-facts"></dl>
      <div id="b-cancel-info"></div>

      <h3>Scrivi alla struttura</h3>
      <form id="message-form">
        <label>Messaggio<textarea name="message" maxlength="2000" required></textarea></label>
        <button class="btn ghost" type="submit">Invia messaggio</button>
        <div id="message-msg"></div>
      </form>

      <div id="cancel-box">
        <h3>Cancellazione</h3>
        <p class="muted small" id="cancel-terms"></p>
        <form id="cancel-form">
          <label>Motivo (facoltativo)<textarea name="message" maxlength="2000"></textarea></label>
          <button class="btn danger" type="submit">Richiedi la cancellazione</button>
          <div id="cancel-msg"></div>
        </form>
      </div>
    </section>
  </main>

  <footer>
    <div class="wrap">
      <span>© <span id="year"></span> <span data-c="titolo"></span></span>
      <span class="links"><a href="termini.html">Termini e condizioni</a><a href="regolamento.html">Regolamento</a><a href="privacy.html">Privacy</a><a href="admin/">Area riservata</a></span>
    </div>
    <div class="wrap legal-line" id="legal-line"></div>
  </footer>

  <script type="module" src="js/prenotazione.js"></script>
  <script type="module" src="js/footer.js"></script>
</body>
</html>
